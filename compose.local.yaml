# Configuração local (máquina do desenvolvedor).
#
# Uso: docker compose -f compose.yaml -f compose.develop.yaml -f compose.local.yaml up -d
#
# Lê as variáveis do .env do projeto (dispensando criar develop.env na mão),
# expõe o Caddy em http://localhost:80 e mantém o APP_ENV em development.

services:
  app:
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_PORT: 5432
  queue:
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_PORT: 5432
  caddy:
    ports:
      - "80:80"
  db:
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
  test:
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: testing
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./.env:/var/www/html/.env:ro