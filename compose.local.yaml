# Configuração local (máquina do desenvolvedor).
#
# Uso: docker compose -f compose.yaml -f compose.develop.yaml -f compose.local.yaml up -d
#
# Herda a camada de .env (base) + develop.env (delta, opcional) dos env_file do
# compose.develop.yaml, expõe o Caddy em http://localhost:80 e mantém o APP_ENV
# em development (com debug habilitado mesmo quando develop.env está ausente).

services:
  app:
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      LOG_LEVEL: debug
      DB_HOST: db
      DB_PORT: 5432
  queue:
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      LOG_LEVEL: debug
      DB_HOST: db
      DB_PORT: 5432
  caddy:
    ports:
      - "80:80"
  db:
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
  test:
    environment:
      APP_ENV: testing
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./.env:/var/www/html/.env:ro