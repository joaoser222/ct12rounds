name: master

on:
  push:
    branches: [master]

env:
  REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
  IMAGE: ct12rounds

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ct12rounds
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ct12rounds_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ct12rounds"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, pdo_pgsql, zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan config:clear
      - run: php artisan test --compact
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: ct12rounds
          DB_PASSWORD: secret

  build:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - run: |
          echo '{"insecure-registries": ["${{ secrets.REGISTRY_HOST }}"]}' | sudo tee /etc/docker/daemon.json
          sudo service docker restart
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          file: docker/Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY_HOST }}/${{ env.IMAGE }}:production
          cache-from: type=inline
          cache-to: type=inline

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: ct12rounds-deploy
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            SRC="${{ secrets.DEPLOY_PATH }}"
            DEPLOY="${SRC}-deploy"
            git -C "$SRC" fetch origin
            if git -C "$DEPLOY" rev-parse --git-dir >/dev/null 2>&1; then
              git -C "$DEPLOY" fetch origin
              git -C "$DEPLOY" checkout --force --detach origin/master
            else
              git -C "$SRC" worktree add --force --detach "$DEPLOY" origin/master
            fi
            ln -sfn "$SRC/.env" "$DEPLOY/.env"
            mkdir -p "$SRC/backups" "$DEPLOY/public/build"
            export BACKUP_HOST_PATH="$SRC/backups"
            export APP_IMAGE=${{ secrets.REGISTRY_HOST }}/${{ env.IMAGE }}:production
            COMPOSE="docker compose -p ct12rounds --project-directory $DEPLOY -f $DEPLOY/docker/compose.yaml -f $DEPLOY/docker/compose.production.yaml --profile monitoring"
            $COMPOSE pull app
            $COMPOSE up -d db registry
            $COMPOSE run --rm --no-deps app php artisan db:backup || true
            $COMPOSE run --rm --no-deps app php artisan migrate --force
            $COMPOSE run --rm --no-deps app php artisan db:seed --class=SettingSeeder --force
            $COMPOSE up -d app
            $COMPOSE up -d --force-recreate --no-deps caddy
            $COMPOSE up -d loki promtail grafana
