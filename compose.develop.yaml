services:
  app:
    env_file:
      - path: develop.env
        required: false
    command: >-
      sh -c 'set -e;
      [ -f vendor/autoload.php ] || composer install --no-interaction --prefer-dist;
      mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/framework/testing storage/logs bootstrap/cache;
      chown -R www-data:www-data storage bootstrap/cache;
      php artisan migrate --force;
      exec php-fpm'
    volumes:
      - ./:/var/www/html
      - composer_vendor:/var/www/html/vendor
      - laravel_storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
  caddy:
    container_name: ct12rounds_caddy
    volumes:
      - ./public:/var/www/html/public:ro
      - laravel_storage:/var/www/html/storage:ro
  db:
    env_file:
      - path: develop.env
        required: false
  queue:
    env_file:
      - path: develop.env
        required: false
  test:
    container_name: ct12rounds_test
    build:
      context: .
    image: ${APP_IMAGE:-ct12rounds:local}
    command: >-
      sh -c 'php artisan migrate:fresh --force --env=testing && php artisan test --compact'
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: develop.env
        required: false
    environment:
      APP_ENV: testing
      DB_DATABASE: ct12rounds_test
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    volumes:
      - ./public/build:/var/www/html/public/build:ro
      - ./docker/php/test-memory-limit.ini:/usr/local/etc/php/conf.d/zz-test-memory-limit.ini:ro
    profiles: ["test"]

volumes:
  composer_vendor:
    name: ct12rounds_composer_vendor
  bootstrap_cache:
    name: ct12rounds_bootstrap_cache
  laravel_storage:
    name: ct12rounds_laravel_storage
