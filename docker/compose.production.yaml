services:
  app:
    env_file:
      - path: .env
        required: true
      - path: production.env
        required: true
    command: >-
      sh -c 'set -e;
      node /var/www/html/bootstrap/ssr/ssr.js > /tmp/ssr.log 2>&1 &
      mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/framework/testing storage/logs bootstrap/cache;
      find storage bootstrap/cache -path storage/app/backups -prune -o -exec chown www-data:www-data {} +;
      rm -rf /build-shared/* && cp -a public/build/. /build-shared/;
      exec php-fpm'
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    volumes:
      - laravel_storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
      - public_build:/build-shared
      - ${BACKUP_HOST_PATH:-./backups}:/var/www/html/storage/app/backups
  caddy:
    container_name: ct12rounds_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/var/www/html/public:ro
      - public_build:/var/www/html/public/build
  db:
    env_file:
      - path: .env
        required: true
      - path: production.env
        required: true
  queue:
    user: "www-data"
    env_file:
      - path: .env
        required: true
      - path: production.env
        required: true
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - laravel_storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
  scheduler:
    container_name: ct12rounds_scheduler
    user: "www-data"
    env_file:
      - path: .env
        required: true
      - path: production.env
        required: true
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - laravel_storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
      - ${BACKUP_HOST_PATH:-./backups}:/var/www/html/storage/app/backups

  app_develop:
    container_name: ct12rounds_app_develop
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${APP_IMAGE_DEVELOP:-ct12rounds:local}
    env_file:
      - path: .env
        required: true
      - path: develop.env
        required: true
    environment:
      DB_HOST: db
    command: >-
      sh -c 'set -e;
      mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/framework/testing storage/logs bootstrap/cache;
      chown -R www-data:www-data storage bootstrap/cache;
      exec php-fpm'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_develop_storage:/var/www/html/storage
      - app_develop_bootstrap_cache:/var/www/html/bootstrap/cache
volumes:
  app_develop_storage:
    name: ct12rounds_app_develop_storage
  app_develop_bootstrap_cache:
    name: ct12rounds_app_develop_bootstrap_cache
  laravel_storage:
    name: ct12rounds_laravel_storage
  bootstrap_cache:
    name: ct12rounds_bootstrap_cache
  public_build:
    name: ct12rounds_public_build
